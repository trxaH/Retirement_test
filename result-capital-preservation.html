<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capital Preservation | Lion Global Investors</title>

  <!-- Open Graph Title -->
  <meta property="og:title" content="Capital Preservation | Lion Global Investors">

  <!-- Optional: Specify the type of content -->
  <meta property="og:type" content="website">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />

  <script src="result.js"></script>

</head>

<body>
  <div class="ans-wrapper">
    <div class="uk-container uk-container-small">
      <div class="uk-card uk-card-default uk-card-body quiz-ans-card">

        <div class="ans-banner-container">
          <img class="main-img ans-banner-img" src="pic/capital.png" alt="Capital Preservation">
        </div>

        <div class="share-results">
          <p>Share your quiz results!</p>
          <div class="social-media-icons">
            <a href="#" id="shareInstagram" class="share-links instagram" target="_blank">
              <img src="pic/instagram.png" alt="Instagram" />
            </a>
            <!-- <a href="#" class="share-links facebook" target="_blank">
              <img src="public/images/fb.png" alt="Facebook" />
            </a>
            <a href="#" class="share-links linkedin" target="_blank">
              <img src="public/images/link.png" alt="LinkedIn" />
            </a> -->
          </div>
        </div>
      </div>
    </div>
  </div>

</body>

</html>

<script>
  document.getElementById("shareInstagram").addEventListener("click", async (event) => {
      event.preventDefault();
  
      const imageURL = "/pic/capital.png"; // Update with your image path
  
      if (navigator.share) {
          // Fetch the image file
          const response = await fetch(imageURL);
          const blob = await response.blob();
          const file = new File([blob], "capital.png", { type: blob.type });
  
          // Use the native share API with the image file
          navigator.share({
              title: "Game Result",
              text: "Check out my game result!",
              files: [file], // Share the image file
          })
          .then(() => console.log("Shared successfully"))
          .catch((error) => console.error("Error sharing:", error));
      } else {
          // Fallback for desktop or unsupported browsers
          const instagramDeepLink = `instagram://story-camera`;
          window.open(instagramDeepLink, "_blank");
      }
  });
  </script>
